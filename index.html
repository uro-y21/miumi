<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>名古屋のセックス デラックス</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Impact:wght@400;700&family=Noto+Sans+JP:wght@900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            overflow: hidden;
            background: linear-gradient(45deg, #ff0000, #ff00ff, #00ffff, #ffff00, #ff0000);
            background-size: 500% 500%;
            animation: rainbow-bg 0.4s linear infinite;
            font-family: 'Impact', 'Noto Sans JP', sans-serif;
            height: 100vh;
            position: relative;
            cursor: pointer;
        }

        @keyframes rainbow-bg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 飛ぶ文字 */
        .flying-text {
            position: absolute;
            font-size: 110px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 30px #fff, 0 0 70px #ff00ff, 0 0 100px #00ffff;
            white-space: nowrap;
            animation: slideFromRight 4s linear forwards;
            z-index: 10;
            transform: rotate(-12deg);
        }

        @keyframes slideFromRight {
            from { transform: translateX(120vw) rotate(-12deg); }
            to { transform: translateX(-120vw) rotate(-12deg); }
        }

        /* デラックス本体 */
        .center-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.1);
            font-size: 260px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 40px #fff, 0 0 80px #ff00ff, 0 0 130px #00ffff, 0 0 180px #ffff00;
            z-index: 20;
            letter-spacing: -15px;
            opacity: 0;
            animation: zoomIn 2.2s forwards 2.2s, 
                       rainbow-flash 0.18s linear infinite 4.4s,
                       bounce 0.6s infinite 4.4s;
        }

        @keyframes zoomIn {
            0% { transform: translate(-50%, -50%) scale(0.1); opacity: 0; }
            60% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
            80% { transform: translate(-50%, -50%) scale(0.95); }
            100% { transform: translate(-50%, -50%) scale(1.0); }
        }

        @keyframes rainbow-flash {
            0%   { color: #ff0000; text-shadow: 0 0 50px #ff0000, 0 0 100px #ffff00; }
            14%  { color: #ffff00; text-shadow: 0 0 50px #ffff00, 0 0 100px #00ff00; }
            28%  { color: #00ff00; text-shadow: 0 0 50px #00ff00, 0 0 100px #00ffff; }
            42%  { color: #00ffff; text-shadow: 0 0 50px #00ffff, 0 0 100px #0000ff; }
            57%  { color: #0000ff; text-shadow: 0 0 50px #0000ff, 0 0 100px #ff00ff; }
            71%  { color: #ff00ff; text-shadow: 0 0 50px #ff00ff, 0 0 100px #ffff00; }
            100% { color: #ff0000; text-shadow: 0 0 50px #ff0000, 0 0 100px #ffff00; }
        }

        @keyframes bounce {
            0%, 100% { transform: translate(-50%, -50%) scale(1) rotate(-6deg); }
            50% { transform: translate(-50%, -50%) scale(1.08) rotate(6deg); }
        }

        .nagoya-item {
            position: absolute;
            font-size: 75px;
            z-index: 5;
            text-shadow: 0 0 30px #fff, 0 0 60px #ffff00;
            animation: popNagoya 2.5s ease-in-out infinite;
        }

        @keyframes popNagoya {
            0% { transform: scale(0.1) rotate(0deg); opacity: 0; }
            20% { transform: scale(1.35) rotate(30deg); opacity: 1; }
            50% { transform: scale(0.9) rotate(-25deg); }
            100% { transform: scale(1.1) rotate(0deg); opacity: 0.9; }
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 30%, rgba(255,0,200,0.35) 70%, rgba(0,0,0,0.5) 100%);
            animation: intense-flash 0.12s infinite alternate;
            z-index: 15;
            pointer-events: none;
            opacity: 0;
            animation-delay: 4.2s;
        }

        @keyframes intense-flash {
            from { opacity: 0.25; } to { opacity: 0.8; }
        }

        canvas { position: absolute; top: 0; left: 0; z-index: 8; pointer-events: none; }
    </style>
</head>
<body>
    <div class="center-text">デラックス</div>
    <div class="overlay"></div>
    <canvas id="sparkles"></canvas>

    <script>
        const nagoyaItems = ['🍜','🐟','🏯','🍛','🍡','🐔','🌸','🚄','🍵','🎋','🥢','🔥','🦀','🍤','🏮'];

        function createNagoyaItem() {
            const item = document.createElement('div');
            item.className = 'nagoya-item';
            item.textContent = nagoyaItems[Math.floor(Math.random() * nagoyaItems.length)];
            item.style.left = Math.random() * 100 + 'vw';
            item.style.top = Math.random() * 85 + 'vh';
            item.style.animationDuration = (2 + Math.random() * 2) + 's';
            item.style.fontSize = (55 + Math.random() * 65) + 'px';
            document.body.appendChild(item);
            setTimeout(() => item.remove(), 6500);
        }

        // 飛ぶ文字
        function createFlyingText() {
            const t = document.createElement('div');
            t.className = 'flying-text';
            t.textContent = '名古屋のセックス';
            t.style.top = (15 + Math.random() * 55) + '%';
            t.style.fontSize = (95 + Math.random() * 45) + 'px';
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 5000);
        }

        // 初期演出
        setTimeout(() => createFlyingText(), 200);
        setTimeout(() => createFlyingText(), 900);

        // 名古屋名物は少し遅れて登場
        setTimeout(() => {
            setInterval(() => {
                for (let i = 0; i < 4; i++) createNagoyaItem();
            }, 280);
        }, 800);

        // キラキラ粒子（強化）
        const canvas = document.getElementById('sparkles');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 8 + 3;
                this.speedX = Math.random() * 6 - 3;
                this.speedY = Math.random() * 6 - 3;
                this.color = `hsl(${Math.random()*360},100%,90%)`;
                this.life = 70 + Math.random() * 50;
            }
            update() {
                this.x += this.speedX; this.y += this.speedY; this.life--; this.size *= 0.97;
                if (this.life <= 0 || this.size <= 0.6) this.reset();
            }
            draw() {
                ctx.shadowBlur = 25;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 280; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        // インタラクション（クリックでさらに派手）
        document.addEventListener('click', () => {
            for (let i = 0; i < 45; i++) createNagoyaItem();
        });

        // 最初の大爆発（デラックス登場後）
        setTimeout(() => {
            for (let i = 0; i < 70; i++) createNagoyaItem();
        }, 4800);
    </script>
</body>
</html>
