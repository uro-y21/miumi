<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>名古屋のセックス デラックス</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Impact:wght@400;700&family=Noto+Sans+JP:wght@900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            overflow: hidden;
            background: linear-gradient(45deg, #1a0033, #330033, #000000);
            background-size: 400% 400%;
            animation: bg-pulse 10s linear infinite;
            font-family: 'Impact', 'Noto Sans JP', sans-serif;
            height: 100vh;
            position: relative;
            cursor: pointer;
        }

        @keyframes bg-pulse {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 名古屋のセックス（ゆったり・1回だけ長く） */
        .flying-text {
            position: absolute;
            font-size: 105px;
            font-weight: 900;
            color: #ffccff;
            text-shadow: 0 0 25px #ff99ff;
            white-space: nowrap;
            animation: slideFromRight 6s linear forwards;
            z-index: 10;
        }

        @keyframes slideFromRight {
            from { transform: translateX(130vw); }
            to { transform: translateX(-130vw); }
        }

        /* デラックス */
        .center-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.05);
            font-size: 245px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 40px #ffffff;
            z-index: 20;
            letter-spacing: -12px;
            opacity: 0;
            animation: zoomIn 3.8s cubic-bezier(0.23, 1, 0.32, 1) forwards 6.2s,
                       keepFlashing 0.16s linear infinite 10s;
        }

        @keyframes zoomIn {
            0%   { transform: translate(-50%, -50%) scale(0.05); opacity: 0; }
            65%  { transform: translate(-50%, -50%) scale(1.08); opacity: 1; }
            82%  { transform: translate(-50%, -50%) scale(0.97); }
            100% { transform: translate(-50%, -50%) scale(1.0); }
        }

        @keyframes keepFlashing {
            0%   { color: #ff0000; text-shadow: 0 0 50px #ff0000, 0 0 110px #ffff00; }
            14%  { color: #ffff00; text-shadow: 0 0 50px #ffff00, 0 0 110px #00ff00; }
            28%  { color: #00ff00; text-shadow: 0 0 50px #00ff00, 0 0 110px #00ffff; }
            42%  { color: #00ffff; text-shadow: 0 0 50px #00ffff, 0 0 110px #ff00ff; }
            57%  { color: #ff00ff; text-shadow: 0 0 50px #ff00ff, 0 0 110px #ffff00; }
            71%  { color: #ffff00; text-shadow: 0 0 50px #ffff00, 0 0 110px #ff0000; }
            100% { color: #ff0000; text-shadow: 0 0 50px #ff0000, 0 0 110px #ffff00; }
        }

        .nagoya-item {
            position: absolute;
            font-size: 72px;
            z-index: 5;
            text-shadow: 0 0 25px #ffff99;
            animation: popNagoya 2.8s ease-in-out infinite;
        }

        @keyframes popNagoya {
            0% { transform: scale(0.1) rotate(0deg); opacity: 0; }
            22% { transform: scale(1.35) rotate(25deg); opacity: 1; }
            55% { transform: scale(0.92) rotate(-20deg); }
            100% { transform: scale(1.08) rotate(8deg); opacity: 0.9; }
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, rgba(255,255,255,0.18) 30%, rgba(255,80,255,0.25) 65%, transparent 80%);
            z-index: 15;
            pointer-events: none;
            opacity: 0;
            animation: burst-overlay 0.14s infinite alternate 10s;
        }

        @keyframes burst-overlay {
            from { opacity: 0.15; }
            to { opacity: 0.65; }
        }

        canvas { position: absolute; top: 0; left: 0; z-index: 8; pointer-events: none; }
    </style>
</head>
<body>
    <div class="center-text">デラックス</div>
    <div class="overlay"></div>
    <canvas id="sparkles"></canvas>

    <script>
        const nagoyaItems = ['🍜','🐟','🏯','🍛','🍡','🐔','🌸','🚄','🍵','🎋','🥢','🔥','🦀','🍤','🏮'];

        function createNagoyaItem() {
            const item = document.createElement('div');
            item.className = 'nagoya-item';
            item.textContent = nagoyaItems[Math.floor(Math.random() * nagoyaItems.length)];
            item.style.left = Math.random() * 100 + 'vw';
            item.style.top = Math.random() * 85 + 'vh';
            item.style.animationDuration = (2.2 + Math.random() * 2.5) + 's';
            item.style.fontSize = (52 + Math.random() * 65) + 'px';
            document.body.appendChild(item);
            setTimeout(() => item.remove(), 7500);
        }

        function createFlyingText() {
            const t = document.createElement('div');
            t.className = 'flying-text';
            t.textContent = '名古屋のセックス';
            t.style.top = (25 + Math.random() * 45) + '%';
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 6500);
        }

        // 飛ぶ文字（1回だけ長めに）
        setTimeout(() => createFlyingText(), 400);

        // 名古屋名物はデラックス登場直前〜登場後にスタート
        setTimeout(() => {
            setInterval(() => {
                for (let i = 0; i < 4; i++) createNagoyaItem();
            }, 320);
        }, 5800);

        // キラキラ
        const canvas = document.getElementById('sparkles');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 6 + 2.5;
                this.speedX = Math.random() * 5 - 2.5;
                this.speedY = Math.random() * 5 - 2.5;
                this.color = `hsl(${Math.random()*360},100%,88%)`;
                this.life = 90 + Math.random() * 50;
            }
            update() {
                this.x += this.speedX; this.y += this.speedY; this.life--; this.size *= 0.972;
                if (this.life <= 0 || this.size <= 0.5) this.reset();
            }
            draw() {
                ctx.shadowBlur = 20;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 220; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        // デラックス登場後の大爆発
        setTimeout(() => {
            for (let i = 0; i < 80; i++) createNagoyaItem();
        }, 10200);

        // クリックでさらに派手
        document.addEventListener('click', () => {
            for (let i = 0; i < 45; i++) createNagoyaItem();
        });
    </script>
</body>
</html>
