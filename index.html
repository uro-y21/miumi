<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>名古屋のセックス デラックス</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Impact:wght@400;700&family=Noto+Sans+JP:wght@900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            overflow: hidden;
            background: linear-gradient(45deg, #1a0033, #330033, #000000);
            background-size: 400% 400%;
            animation: bg-pulse 8s linear infinite;
            font-family: 'Impact', 'Noto Sans JP', sans-serif;
            height: 100vh;
            position: relative;
            cursor: pointer;
        }

        @keyframes bg-pulse {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 飛ぶ文字（落ち着いた演出） */
        .flying-text {
            position: absolute;
            font-size: 100px;
            font-weight: 900;
            color: #ffccff;
            text-shadow: 0 0 20px #ff99ff;
            white-space: nowrap;
            animation: slideFromRight 5s linear forwards;
            z-index: 10;
            opacity: 0.9;
        }

        @keyframes slideFromRight {
            from { transform: translateX(120vw); }
            to { transform: translateX(-120vw); }
        }

        /* デラックス */
        .center-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.05);
            font-size: 260px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 30px #fff;
            z-index: 20;
            letter-spacing: -12px;
            opacity: 0;
            animation: zoomIn 3s cubic-bezier(0.25, 0.1, 0.25, 1) forwards 2.2s,
                       postFlash 0.18s linear infinite 5.2s;
        }

        @keyframes zoomIn {
            0%   { transform: translate(-50%, -50%) scale(0.05); opacity: 0; }
            70%  { transform: translate(-50%, -50%) scale(1.12); opacity: 1; }
            85%  { transform: translate(-50%, -50%) scale(0.96); }
            100% { transform: translate(-50%, -50%) scale(1.0); }
        }

        @keyframes postFlash {
            0%   { color: #ff0000; text-shadow: 0 0 40px #ff0000, 0 0 90px #ffff00; }
            14%  { color: #ffff00; text-shadow: 0 0 40px #ffff00, 0 0 90px #00ff00; }
            28%  { color: #00ff00; text-shadow: 0 0 40px #00ff00, 0 0 90px #00ffff; }
            42%  { color: #00ffff; text-shadow: 0 0 40px #00ffff, 0 0 90px #ff00ff; }
            57%  { color: #ff00ff; text-shadow: 0 0 40px #ff00ff, 0 0 90px #ffff00; }
            71%  { color: #ffff00; text-shadow: 0 0 40px #ffff00, 0 0 90px #ff0000; }
            100% { color: #ff0000; text-shadow: 0 0 40px #ff0000, 0 0 90px #ffff00; }
        }

        .nagoya-item {
            position: absolute;
            font-size: 70px;
            z-index: 5;
            text-shadow: 0 0 20px #ffff99;
            animation: popNagoya 3s ease-in-out infinite;
            opacity: 0.85;
        }

        @keyframes popNagoya {
            0% { transform: scale(0.1) rotate(0deg); opacity: 0; }
            25% { transform: scale(1.3) rotate(20deg); opacity: 1; }
            60% { transform: scale(0.95) rotate(-15deg); }
            100% { transform: scale(1.05) rotate(5deg); opacity: 0.9; }
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(255,255,255,0.25) 30%, transparent 70%);
            z-index: 15;
            pointer-events: none;
            opacity: 0;
            animation: big-burst 0.15s infinite alternate 5.2s;
        }

        @keyframes big-burst {
            from { opacity: 0.2; background-color: rgba(255, 100, 255, 0.3); }
            to   { opacity: 0.75; background-color: rgba(255, 255, 100, 0.25); }
        }

        canvas { position: absolute; top: 0; left: 0; z-index: 8; pointer-events: none; }
    </style>
</head>
<body>
    <div class="center-text">デラックス</div>
    <div class="overlay"></div>
    <canvas id="sparkles"></canvas>

    <script>
        const nagoyaItems = ['🍜','🐟','🏯','🍛','🍡','🐔','🌸','🚄','🍵','🎋','🥢','🔥','🦀','🍤','🏮'];

        function createNagoyaItem() {
            const item = document.createElement('div');
            item.className = 'nagoya-item';
            item.textContent = nagoyaItems[Math.floor(Math.random() * nagoyaItems.length)];
            item.style.left = Math.random() * 100 + 'vw';
            item.style.top = Math.random() * 85 + 'vh';
            item.style.animationDuration = (2.5 + Math.random() * 2) + 's';
            item.style.fontSize = (50 + Math.random() * 60) + 'px';
            document.body.appendChild(item);
            setTimeout(() => item.remove(), 7000);
        }

        function createFlyingText() {
            const t = document.createElement('div');
            t.className = 'flying-text';
            t.textContent = '名古屋のセックス';
            t.style.top = (20 + Math.random() * 50) + '%';
            t.style.fontSize = (85 + Math.random() * 35) + 'px';
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 5500);
        }

        // 落ち着いた飛ぶ文字（2回だけ）
        setTimeout(() => createFlyingText(), 300);
        setTimeout(() => createFlyingText(), 1400);

        // 名古屋名物はデラックス登場後に本格スタート
        setTimeout(() => {
            setInterval(() => {
                for (let i = 0; i < 3; i++) createNagoyaItem();
            }, 350);
        }, 3200);

        // キラキラ粒子
        const canvas = document.getElementById('sparkles');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 5 + 2;
                this.speedX = Math.random() * 4 - 2;
                this.speedY = Math.random() * 4 - 2;
                this.color = `hsl(${Math.random()*360}, 100%, 85%)`;
                this.life = 80 + Math.random() * 60;
            }
            update() {
                this.x += this.speedX; this.y += this.speedY; this.life--; this.size *= 0.975;
                if (this.life <= 0 || this.size <= 0.5) this.reset();
            }
            draw() {
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 180; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        // パンパカパーーン演出（デラックス停止後）
        function bigBurst() {
            for (let i = 0; i < 120; i++) {
                const item = document.createElement('div');
                item.className = 'nagoya-item';
                item.textContent = nagoyaItems[Math.floor(Math.random() * nagoyaItems.length)];
                item.style.left = Math.random() * 100 + 'vw';
                item.style.top = Math.random() * 100 + 'vh';
                item.style.animationDuration = '1.2s';
                item.style.fontSize = (40 + Math.random() * 90) + 'px';
                document.body.appendChild(item);
                setTimeout(() => item.remove(), 2000);
            }
            // 粒子も一気に爆発
            particles.forEach(p => {
                p.speedX *= 3;
                p.speedY *= 3;
                p.life = 40;
            });
        }

        // デラックス登場後に大爆発
        setTimeout(bigBurst, 5200);

        // クリックで追加爆発
        document.addEventListener('click', () => {
            for (let i = 0; i < 50; i++) createNagoyaItem();
        });
    </script>
</body>
</html>
